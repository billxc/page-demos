<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172036;
      background: #f4f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(109, 94, 252, 0.14), transparent 28rem),
        radial-gradient(circle at 85% 85%, rgba(49, 181, 164, 0.12), transparent 26rem),
        #f4f6fb;
    }

    .page {
      width: min(100%, 440px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #1b2440;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #725cff, #4a35dc);
      box-shadow: 0 8px 20px rgba(91, 70, 230, 0.26);
      font-size: 15px;
    }

    .card {
      padding: 40px;
      border: 1px solid rgba(24, 34, 57, 0.08);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 60px rgba(29, 39, 70, 0.12);
    }

    h1 {
      margin: 0;
      color: #151c30;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: -0.04em;
      text-align: center;
    }

    .intro {
      margin: 10px 0 30px;
      color: #70788c;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #283149;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d8dce7;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #172036;
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input::placeholder {
      color: #a3a9b8;
    }

    input:hover {
      border-color: #b7bdcc;
    }

    input:focus {
      border-color: #6652e8;
      box-shadow: 0 0 0 4px rgba(102, 82, 232, 0.12);
    }

    button {
      width: 100%;
      height: 50px;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, #725cff, #553ee1);
      box-shadow: 0 10px 22px rgba(89, 65, 222, 0.24);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 26px rgba(89, 65, 222, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid rgba(102, 82, 232, 0.3);
      outline-offset: 3px;
    }

    .footer {
      margin: 22px 0 0;
      color: #8b92a3;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .card {
        padding: 30px 22px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand" aria-hidden="true">
      <span class="brand-mark">N</span>
      Northstar
    </div>

    <section class="card" aria-labelledby="sign-in-title">
      <h1 id="sign-in-title">Sign in</h1>
      <p class="intro">Welcome back. Enter your details to continue.</p>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit">Continue</button>
      </form>
    </section>

    <p class="footer">Secure access to your workspace</p>
  </main>
</body>
</html>
